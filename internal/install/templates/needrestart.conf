# Managed by CloudGround.
# needrestart (installed by default on Ubuntu) restarts every service that
# maps a library the system just upgraded. A transient unit of the agent's
# is a single command it waits for (a backup, a restore, a database import,
# a malware scan, a package install): restarted halfway, systemd runs it
# again from the start while the agent still waits for the first run.
# The panel's services and the sites' PHP stay under needrestart's normal
# handling; only these transient units are left alone.
$nrconf{override_rc}->{qr(^cg-helper-)} = 0;
$nrconf{override_rc}->{qr(^cg-restic-)} = 0;
$nrconf{override_rc}->{qr(^cg-scan-)} = 0;
$nrconf{override_rc}->{qr(^cg-wp-)} = 0;
$nrconf{override_rc}->{qr(^cg-malware-signatures-)} = 0;
$nrconf{override_rc}->{qr(^cg-clamav-install-)} = 0;
$nrconf{override_rc}->{qr(^cg-apparmor-freshclam-)} = 0;
$nrconf{override_rc}->{qr(^cg-cron-)} = 0;
$nrconf{override_rc}->{qr(^cg-apt-)} = 0;
