# Managed by CloudGround.
# Listen queues. The kernel caps any backlog nginx asks for at somaxconn, and
# the former default of 511 turns a traffic spike into refused connections
# where a longer queue would only have made them wait.
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
# Packets the network card may hand over faster than the kernel takes them.
net.core.netdev_max_backlog = 16384
# Outbound connections may reuse a socket in TIME_WAIT. (Unrelated to
# tcp_tw_recycle, removed from Linux long ago for breaking clients behind NAT.)
net.ipv4.tcp_tw_reuse = 1
# Keep the congestion window across idle periods, so a short cached reply on a
# kept-alive connection does not start slow again.
net.ipv4.tcp_slow_start_after_idle = 0
# Local ports for the connections nginx opens to PHP and upstreams.
net.ipv4.ip_local_port_range = 1024 65535
# Open files for the whole system; each service also has its own limit.
fs.file-max = 500000
# Pinned, not left to the distribution's defaults: a symlink in a sticky
# world-writable directory (/tmp) is followed only when its owner is the
# follower's or the directory's, and a hard link is made only to a file the
# linker owns or can write. One tenant cannot lead root, or another site, to a
# file of its choosing through a shared directory.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
