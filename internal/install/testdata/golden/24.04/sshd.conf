# CloudGround: SFTP for site users, jailed in their own folder, without a shell
DenyGroups cg-sftp-off
Match User cg-site-*
    ChrootDirectory %h
    # No symlinks or hardlinks over SFTP: their targets are stored verbatim and
    # resolved later outside the chroot, by nginx or by root.
    ForceCommand internal-sftp -d / -P symlink,hardlink@openssh.com
    DisableForwarding yes
    AllowTcpForwarding no
    X11Forwarding no
    PasswordAuthentication yes
    PermitEmptyPasswords no
