# Managed by CloudGround.
# The nginx logs of every site.
/var/log/cloudground/*/*.log {
    daily
    # A busy site writes gigabytes a day; rotate early when logrotate runs.
    maxsize 1G
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    # nginx keeps each log open. A renamed log would go on growing unseen
    # under its old inode until nginx reopened it, so the file is copied and
    # emptied in place, and no site needs a reload after a rotation.
    copytruncate
}
